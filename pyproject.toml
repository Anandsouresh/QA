[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qagen"
version = "0.1.0"
description = "Generate structured QA test cases and a navigation graph from a live URL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "openpyxl>=3.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
qagen = "qagen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["qagen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
