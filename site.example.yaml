# QAGen configuration. Everything site-specific lives here; the CLI overrides
# only a handful of top-level values.
#
#   qagen run --config site.example.yaml

target:
  url: https://app.example.com/dashboard
  depth: 1                      # 0 = single page only
  same_origin_only: true
  include_paths: []             # e.g. ["/dashboard/**", "/settings/**"]
  exclude_paths: ["/logout", "/signout", "/admin/**"]
  # Escape hatch for sites with meaningful numeric routes. Without this,
  # /year/2024 normalizes to /year/{id} and collapses with /year/2023.
  id_collapse_exceptions: []    # e.g. ["year/*", "v[0-9]"]

auth:
  # Playwright storage_state JSON, or a raw cookie-array export from a browser
  # extension -- both are accepted, detected by shape.
  storage_state: ./secrets/auth.json
  # Proves the session is live. Without it, an expired cookie silently
  # redirects to the login page and we generate 40 test cases for a login form.
  verify_selector: "[data-testid=user-menu]"
  verify_timeout_ms: 5000

crawl:
  max_pages: 25
  max_clicks: 200
  max_wall_clock_seconds: 900
  max_clicks_per_state: 30
  max_consecutive_no_new_states: 20
  settle_timeout_ms: 3000
  action_timeout_ms: 8000
  nav_timeout_ms: 20000
  probe_search: true
  search_probe_term: qa

interaction:
  policy: safe_click            # safe_click | passive
  # Extends the built-in destructive vocabulary rather than replacing it if you
  # keep the defaults and add your own terms.
  deny_text:
    - delete
    - remove
    - pay
    - purchase
    - submit
    - confirm
    - logout
    - sign out
    - deactivate
    - cancel subscription
  deny_selectors:
    - "[data-destructive]"
    - ".btn-danger"
  allow_selectors: []           # explicit allow beats every deny rule
  dismiss_consent: true

llm:
  provider: claude              # claude | stub
  model: claude-opus-5
  effort: high                  # low | medium | high | xhigh | max
  max_tokens: 16000
  cache_system_prompt: true
  max_cases_per_page: 12

output:
  dir: ./qagen-out
  formats: [markdown, json, xlsx, graph]   # + csv
  save_page_models: true
  save_summaries: false         # prompt blocks, for debugging

browser:
  headless: true
  viewport_width: 1440
  viewport_height: 900
  # The network write-guard. Leave this on. Turning it off lets the crawler
  # send POST/PUT/PATCH/DELETE to the target.
  block_mutations: true
