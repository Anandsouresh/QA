# Module-wise crawl: per-module budgets + seeded sub-pages, and cross-module
# boundary capture (a click leading outside the crawl's module is captured
# once and marked, not explored -- see qagen/browser/crawler.py's NAVIGATION
# branch and GraphBuilder.add_module_boundary).
#
# For a SINGLE module only, pass --module on the command line instead of
# editing this file, e.g.:
#   python -m qagen.cli crawl --config samsungvx-modules.yaml --module screen
# That sets target.include_paths for you and activates the boundary-capture
# path above; leaving --module off crawls everything, using the per-module
# budgets/seeds below to keep it balanced.
# Run until 200 DISTINCT STATES, and stop for nothing else.
#
# Every other budget is lifted far out of reach, and the two silent per-URL /
# per-section caps are set to 200 -- equal to the target, so they cannot turn a
# state away before max_pages does. Any cap that does fire is now reported in
# the run summary instead of quietly starving the frontier.
#
# The one ending this cannot prevent is an empty frontier: if the app has fewer
# than 200 reachable states at this depth, the crawl finishes early. That is the
# app's size, not a limit.
# 200 states, depth 10 -- the full-coverage run.
#
# Elements are worked through in READING ORDER: top to bottom, left to right,
# the way a person reads the screen. Content area first, then the header and
# left menu (which are identical on every state).
#
# Budgets are deliberately loose -- the point is breadth, so the only real stop
# is the 3h wall clock. Section cap 30 keeps any one area (Settings has eleven
# menu items, each with sub-navigation) from taking the whole run.
#
# Headless on purpose: this runs for hours and should not own your screen.
# The write-guard stays ON -- nothing is created, edited or deleted.
target:
  url: https://stg.samsungvx.com/screen
  depth: 20
  same_origin_only: true
  exclude_paths:
  - /logout
  - /signout
  - /login
  - /auth/**
  id_collapse_exceptions: []
auth:
  storage_state: ./secrets/samsungvx.json
  verify_selector: null
crawl:
  max_navigations: 100000
  max_consecutive_no_new_states: 100000
  max_states_per_url: 200
  max_pages: 200
  max_clicks: 100000
  max_clicks_per_state: 200
  max_wall_clock_seconds: 86400
  settle_timeout_ms: 2000
  hydration_timeout_ms: 6000
  stability_ms: 400
  hydration_min_elements: 4
  loader_timeout_ms: 4000
  post_loader_wait_ms: 800
  loader_selectors: []
  # Was 3 (the tool default). A recent run recovered 82 of 104 failed
  # restores and only abandoned 22 states outright -- raising this gives the
  # hard-reset path more chances before giving up on a state entirely.
  max_restore_failures: 5
  action_timeout_ms: 10000
  nav_timeout_ms: 30000
  # The persistent app frame, read off the captured DOM: the header, the two
  # left menus (CMS and Settings), the workspace switcher, the tag explorer and
  # the floating support chat. These are still extracted and still exercised
  # once, but they rank below content-area actions -- so a state cut short by
  # the budget loses furniture, not product.
  # The app tags its own clickables for analytics, and that is the ONLY signal
  # for controls it gives no role, no tabindex and no pointer cursor -- the
  # profile avatar among them, which is the sole route to Settings.
  extra_clickable_selectors:
  - .ga-button-action-class
  - '[ga_text_key]'
  - '[data-ga]'
  - '[data-analytics]'
  - '[data-track]'
  shell_selectors:
  # Bare tokens, not '#id': the extractor prefers data-testid, so a selector
  # arrives as [data-testid="navbar_li_screen"] or as #navbar_li_screen
  # depending on the element. Substring matching catches both forms.
  # Header controls the analytics rule surfaced. Without these they count as
  # content, sort to the top of the reading order (y=23..31) and push the
  # dashboard cards and their "+" buttons out of the per-state click budget.
  - dashboard_buyplan
  - dashboard_vxt_lab
  - dashboard_profile
  - header_logoImg
  - select-wrap
  - navbar_menuList
  - navbar_li_
  - settingNavbar
  - cms_place
  - place_wrap
  - dashboard_workspace
  - header_logo
  - header_profile
  - header_notific
  - profile_detail
  - profileOpera_
  - notificationIconId
  - icon_notific
  - alarmId
  - icon_vxt_labs
  - icon_crown
  - chatbot_start
  - startChatBtn
  - tagexplorer
  - dashboard_terms
  - dashboard_privacy
  - dashboard_cookies
  - dashboard_contactus
  # Per-module budgets, replacing the single max_states_per_section. Without
  # this, one module can starve every other one: Settings alone took 43 of 63
  # states on an early run while Screen, Schedule and Channel got zero.
  module_budgets:
    screen: 40
    content: 40
    playlist: 30
    schedule: 30
    channel: 20
    settings: 50
    default: 15
  # Known sub-pages per module, queued at depth 1 as a floor under normal link
  # discovery -- most of these are reached by clicking a div with no href, so
  # ordinary discovery only finds them if the crawler happens to click every
  # one within its budget.
  module_seeds:
    settings:
    - /settings/general
    - /settings/organization
    - /settings/workspace
    - /settings/user
    - /settings/plan
    - /settings/tag
    - /settings/event
    - /settings/screenpreset
    - /settings/place
    - /settings/emergencyalert
    - /settings/subscription
    - /settings/edithome
    - /settings/activitylog
    - /settings/techinquiry
    schedule:
    - /schedule/create
    playlist:
    - /playlist/create
    - /playlist/sync/create
  # Work through each state the way a person reads it.
  action_order: reading
  content_before_frame: true
  reading_band_px: 20
  # Guarantees the left menu reaches the plan even when content fills the cap.
  # Without it run 1 starved: frontier empty at 34 states, /settings at zero,
  # and the left menu clicked twice in the entire crawl.
  frame_reserve: 8
  probe_search: false
interaction:
  policy: safe_click
  deny_text:
  - delete
  - remove
  - pay
  - purchase
  - submit
  - confirm
  - logout
  - sign out
  - deactivate
  - cancel subscription
  deny_selectors:
  - '[data-destructive]'
  - .btn-danger
  allow_selectors: []
  dismiss_consent: true
output:
  dir: ./samsungvx-modules
  formats:
  - graph
  save_page_models: true
browser:
  headless: true
  viewport_width: 1200
  viewport_height: 900
  block_mutations: true
  # Looks at the shape of an otherwise-blocked POST (its path, its JSON
  # body) and lets it through if it reads as a filter/list call rather than
  # a write. PUT/PATCH/DELETE and any path naming an action (create, delete,
  # sign, chat/start, ...) always stay blocked regardless of body shape --
  # see classify_write_candidate in qagen/browser/session.py.
  #
  # Two endpoints on this target (.../resources, .../places) were blocked
  # despite reading like list calls; this decides that from the real request
  # body at crawl time instead of guessing from the path name.
  classify_ambiguous_writes: true
  # Once a specific endpoint has been confirmed a read (devtools, not a
  # guess), name it here for a deterministic allow -- independent of the
  # classifier above. Empty until something is actually confirmed.
  # Confirmed live (not guessed): each returned a real, populated list --
  # screens, channels, contents, programs, playlists -- at status 200, with
  # a request body of just {"advancedSearch":[]} and the real pagination
  # sitting in the query string (orderBy/order/start/rowsPerPage). These no
  # longer depend on classify_ambiguous_writes re-deciding it every time.
  safe_read_endpoints:
  - /screens/search
  - /contents/search
  - /playlist/search
  - /programs/search
  - /channels/search
