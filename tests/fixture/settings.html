<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QAGen Fixture — Settings</title>
<style>body { font-family: system-ui, sans-serif; padding: 2rem; }</style>
</head>
<body>
<h1>Account settings</h1>
<nav aria-label="Main"><a href="/index.html">Home</a></nav>

<!-- An explicit <form> with real constraints, so the negative and edge-case
     generators have concrete boundaries to work from rather than guesses. -->
<form id="profile-form" action="/api/profile" method="post">
  <div>
    <label for="fullName">Full name</label>
    <input id="fullName" name="fullName" type="text" required
           maxlength="64" minlength="2" autocomplete="name">
  </div>
  <div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required
           autocomplete="email" pattern="[^@\s]+@[^@\s]+\.[a-z]{2,}"
           aria-describedby="email-help">
    <span id="email-help">Use your work address.</span>
  </div>
  <div>
    <label for="card">Card number</label>
    <input id="card" name="card" type="text" autocomplete="cc-number"
           maxlength="19" inputmode="numeric">
  </div>
  <div>
    <label for="seats">Seats</label>
    <input id="seats" name="seats" type="number" min="1" max="500" step="1" value="5">
  </div>
  <div>
    <label for="timezone">Timezone</label>
    <select id="timezone" name="timezone" required>
      <option value="">Choose…</option>
      <option value="utc">UTC</option>
      <option value="ist">Asia/Kolkata</option>
      <option value="pst">America/Los_Angeles</option>
    </select>
  </div>
  <div>
    <label><input type="checkbox" name="notify" checked> Email me updates</label>
  </div>
  <button type="submit" data-testid="save-profile">Save changes</button>
  <button type="button" data-testid="cancel-profile">Cancel</button>
</form>

<!-- Placeholder-as-label: an accessibility defect, and a legitimate UI/UX
     finding the extractor should flag as low-confidence. -->
<section>
  <h2>Referral</h2>
  <input type="text" name="referral" placeholder="Referral code">
  <button data-testid="apply-referral">Apply</button>
</section>
</body>
</html>
